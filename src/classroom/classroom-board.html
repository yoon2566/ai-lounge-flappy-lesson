<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리의 게임 게시판 · AI 셰르파</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--paper:#f3e7d9;--ink:#3b291f;--accent:#8b4f2f;--line:#e0cbb5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}button,.button{font:700 15px/1.5 system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;background:#fffaf3;color:var(--ink);padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:disabled{opacity:.4;cursor:default}button:hover:enabled,.button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{max-width:1160px;margin:auto;padding:28px 28px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.08em;font-size:14px}.brand span{color:var(--accent)}main{max-width:1160px;margin:0 auto;padding:54px 28px 64px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#7d624e;margin:0 0 12px}h1{font-size:clamp(32px,5vw,48px);line-height:1.25;letter-spacing:-.05em;margin:0}h1 span{color:var(--accent)}.intro{color:#7d624e;margin:18px 0 34px;font-size:17px}.toolbar{border-top:2px solid var(--ink);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h2{font-size:18px;margin:0}.status{color:#7d624e;font-size:14px;min-height:24px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:230px;padding:24px;border:1px solid var(--line);border-radius:14px;background:#fffaf3;text-align:left;align-items:stretch;justify-content:flex-start;position:relative;transition:transform .15s,border-color .15s}.card:hover:enabled{transform:translateY(-3px);border-color:var(--accent)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.card-mark{font-size:25px;line-height:1;background:#efdbc4;color:var(--accent);width:46px;height:46px;border-radius:12px;display:grid;place-items:center}.card-size{font-size:12px;color:#7d624e;font-weight:500}.card h3{font-size:20px;line-height:1.4;letter-spacing:-.03em;margin:0 0 12px;overflow-wrap:anywhere;min-height:2.8em;max-height:2.8em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.card-meta{color:#7d624e;font-size:13px;font-weight:400;margin-top:auto;overflow-wrap:anywhere;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-play{color:var(--accent);font-size:13px;margin-top:18px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #cbb096;border-radius:14px;padding:70px 24px;color:#7d624e}.empty strong{display:block;font-size:20px;color:var(--ink);margin-bottom:10px}.pagination{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:32px}.pagination span{font-size:14px;color:#7d624e}footer{border-top:1px solid var(--line);padding-top:24px;margin-top:48px;color:#7d624e;font-size:13px}.viewer{width:min(1140px,calc(100vw - 28px));max-height:calc(100dvh - 28px);padding:0;border:1px solid #e0cbb5;border-radius:16px;background:var(--paper);color:var(--ink)}.viewer::backdrop{background:#3b291fc9}.viewer[open]{display:flex;flex-direction:column}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}.viewer-head h2{font-size:20px;line-height:1.35;overflow-wrap:anywhere;margin:0}.viewer-by{font-size:13px;color:#7d624e;margin-top:5px}.viewer-content{height:min(66dvh,680px);min-height:220px;background:#f3e5d5;position:relative}.viewer-content iframe{display:block;border:0;width:100%;height:100%;background:white}.viewer-loading{padding:36px;color:#7d624e}.viewer-foot{padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.viewer-foot p{font-size:13px;color:#7d624e;margin:0}.viewer-foot .button{background:var(--accent);color:white;border-color:var(--accent)}[hidden]{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-top:36px}.card{padding:20px;min-height:220px}.viewer-foot{flex-wrap:wrap}.viewer-head{padding:14px}.viewer-head h2{font-size:17px}}@media(max-width:440px){header,main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}.card{min-height:195px}.card-top{margin-bottom:20px}header .button{font-size:13px;padding:9px 12px}}
.board-scope{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.board-scope button{min-height:46px;padding:10px 20px}.board-scope button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:white}.board-context-error{grid-column:1/-1;padding:30px 20px;background:#fffaf3;border:1px solid var(--line);border-radius:14px;color:#7d624e}#board-heading{overflow-wrap:anywhere}@media(max-width:440px){.board-scope button{flex:1;padding:10px 12px}}
.work-card{display:flex;flex-direction:column;min-width:0}.work-card .card{width:100%;flex:1;border-radius:14px 14px 0 0}.manage-actions{display:flex;gap:8px;background:#fffaf3;padding:10px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}.manage-actions button{flex:1;padding:8px;font-size:13px}.manage-delete{color:#964b37!important}.teacher-note{padding:12px 16px;background:#f3e5d5;border:1px solid #e0cbb5;border-radius:10px;margin-bottom:16px;font-size:14px}.manage-dialog{width:min(480px,calc(100vw - 32px));border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink);background:var(--paper)}.manage-dialog::backdrop{background:#3b291fa6}.manage-dialog h2{font-size:23px;margin:0 0 14px}.manage-dialog p{overflow-wrap:anywhere}.manage-dialog label{display:block;font-weight:700}.manage-dialog input{width:100%;font:inherit;color:inherit;padding:12px;border:1px solid #cbb096;border-radius:8px;margin-top:8px}.manage-dialog input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.manage-dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#manage-error{font-size:14px;min-height:24px;color:#964b37}
.work-card{position:relative}.work-card:not(.managed) .card{border-radius:14px}.work-card .card-top{padding-inline-end:74px}
.heart-button{min-width:60px;min-height:44px;padding:6px 12px;border-radius:22px;font:700 16px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;background:#fffaf3;color:#964b37;border-color:#e0cbb5}.heart-button[aria-pressed="true"]{color:#964b37;background:#fffaf3;border-color:#cbb096}.heart-button:disabled{opacity:.7}.card-heart{position:absolute;top:12px;right:12px}.heart-feedback{margin:4px 0 10px;min-height:0;color:var(--ink);font-size:14px}.heart-feedback:empty,#viewer-heart:empty{display:none}.viewer-actions{display:flex;align-items:center;gap:12px;flex:none}#viewer-heart-feedback{margin:0 22px 6px}
@media(max-width:440px){.card-heart{top:10px;right:10px}.viewer-actions{gap:6px}.viewer-actions .heart-button{min-width:52px;padding:6px 9px}}
</style>
<script src="/class-board.js" defer></script>
</head>
<body>
<header><div class="brand">AI <span>셰르파</span> · 작품 나누기</div><a id="back-to-lesson" class="button" href="/">← 수업으로 돌아가기</a></header>
<main>
<p class="eyebrow">MADE BY US</p><h1 id="board-heading">우리가 만든<br><span>게임 게시판</span></h1>
<p id="board-intro" class="intro">서로 다른 생각으로 만든 게임들.<br>작품을 눌러 직접 해 보고, 함께 이야기를 나눠 보세요.</p>
<div class="board-scope" id="board-scope" role="group" aria-label="작품 공개 범위" hidden><button id="scope-all" type="button" aria-pressed="true">전체 작품</button><button id="scope-room" type="button" aria-pressed="false">우리 반 작품</button></div><div class="toolbar"><h2 id="works-heading">공유한 작품</h2><button id="refresh" type="button">새로고침 ↻</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p id="heart-feedback" class="heart-feedback" role="status" aria-live="polite"></p>
<div id="teacher-note" class="teacher-note" hidden>선생님 관리 · 우리 반 작품의 제목을 수정하거나 게시물을 삭제할 수 있어요.</div>
<div id="works" class="grid" aria-label="공유한 게임 목록"></div>
<nav class="pagination" aria-label="작품 목록 페이지"><button id="previous" type="button" disabled>← 이전</button><span id="page">1 페이지</span><button id="next" type="button" disabled>다음 →</button></nav>
<footer>수업 화면에서 게시판에 저장하면 이곳에 작품이 올라와요. 게시한 뒤에는 수정 내용을 업데이트할 수 있어요.</footer>
</main>
<dialog id="viewer" class="viewer" aria-labelledby="work-title"><div class="viewer-head"><div><h2 id="work-title">공유한 게임</h2><div id="work-by" class="viewer-by"></div></div><div class="viewer-actions"><div id="viewer-heart"></div><button id="close" type="button" aria-label="게임 닫기">닫기 ×</button></div></div><p id="viewer-heart-feedback" class="heart-feedback" role="status" aria-live="polite"></p><div id="play" class="viewer-content"></div><div class="viewer-foot"><p id="play-hint">게임 화면을 클릭한 뒤 조작해 보세요.</p><a id="download" class="button" hidden>HTML 다운로드 ↓</a></div></dialog>
<dialog id="manage-dialog" class="manage-dialog" aria-labelledby="manage-heading"><form id="manage-form"><h2 id="manage-heading">작품 제목 수정</h2><p id="manage-description"></p><label id="manage-title-label">작품 제목<input id="manage-title" type="text" maxlength="80" required autocomplete="off"></label><label id="manage-author-label">작성자 이름<input id="manage-author" maxlength="40" required autocomplete="off"></label><p id="manage-error" role="status" aria-live="polite"></p><div class="manage-dialog-actions"><button id="manage-cancel" type="button">취소</button><button id="manage-submit" type="submit">제목 저장</button></div></form></dialog>
</body>
</html>
