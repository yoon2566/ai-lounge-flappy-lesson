  function replayIcon(){g.strokeStyle='#f4ecda';g.lineWidth=4;g.beginPath();g.arc(160,302,13,-Math.PI*.2,Math.PI*1.47);g.stroke();g.fillStyle='#f4ecda';g.beginPath();g.moveTo(151,286);g.lineTo(162,286);g.lineTo(159,296);g.fill();}
  function render(now){
    if(mode==='resetting'&&now-resetAt>=1000)ready();
    g.imageSmoothingEnabled=false;sky(now);const motionTime=mode==='playing'?now:stoppedAt;
    for(const c of columns){const x=columnX(c,motionTime);if(x>C.width||x+C.columnW<0)continue;stone(x,0,c.top,true);stone(x,c.top+C.gap,C.field-c.top-C.gap,false);}
    let drawY=visualY,drawAngle=angle;if(mode==='dead'||mode==='resetting'){const p=Math.min(1,(now-deadAt)/1000),ease=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;drawY=fallFrom+Math.max(0,C.field-C.hitH-(C.spriteH-C.hitH)/2-fallFrom)*ease;drawAngle=fallAngle+(90-fallAngle)*ease;}
    character(drawY,drawAngle,sceneTime(now));floor(now);
    if(mode==='playing')number(points,160,22,5);else if(mode==='ready'){number(0,160,22,5);tapIcon(now);}else if(mode==='dead'&&now-deadAt>=1000){g.fillStyle='#273550d9';g.fillRect(96,184,128,148);number(points,160,202,5);trophy(135,236);number(best,171,239,2,'#e6d4a3');medalIcon(medal(points));replayIcon();}
    requestAnimationFrame(render);
  }

  // The parent owns credentials and API calls. Only gameplay events cross the frame.
  const embedded=window.parent!==window;
  let rankPending=false,rankStartRequested=false,rankActive=false,rankLastPoint=0,rankNickname='',rankStartAfterName=true;
  let rankHud=null,rankLayer=null,rankCard=null,rankNameLabel=null,rankNameButton=null,rankBoardButton=null;
  let rankNameInput=null,rankNameStatus=null,rankNameSubmit=null,rankNameBack=null,rankNameConfirmed=false;
  function tellRanking(event,details={}){if(embedded)window.parent.postMessage({channel:'flappy-ranking',event,...details},'*');}
  function rankNode(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=String(text);return element;}
  function rankButton(text,handler,primary=false){const button=rankNode('button',primary?'primary':'',text);button.type='button';button.addEventListener('click',handler);return button;}
  function rankHUD(){if(!rankHud)return;rankNameLabel.textContent=rankNickname||'이름 미설정';rankNameButton.textContent=rankNickname?'이름 변경':'이름 입력';rankNameButton.disabled=rankActive||rankPending;rankBoardButton.disabled=rankActive||rankPending;}
  function closeRankPanel(){if(!rankLayer)return;rankLayer.hidden=true;rankPending=false;rankStartRequested=false;rankHUD();canvas.focus({preventScroll:true});}
  function openRankPanel(title){if(!rankLayer)return;rankCard.replaceChildren(rankNode('h2','',title));rankLayer.hidden=false;rankNameInput=null;rankNameStatus=null;rankNameSubmit=null;rankNameBack=null;}
  function rankLoading(title,text){openRankPanel(title);rankCard.append(rankNode('p','',text));}
  function requestStart(){
    if(mode!=='ready'||rankPending||rankActive)return;
    if(!embedded){start();return;}
    rankPending=true;rankStartRequested=true;rankHUD();rankLoading('준비 중','플레이를 준비하고 있어요…');tellRanking('start-request');
  }
  function rankingPoint(){if(!rankActive||points!==rankLastPoint+1)return;rankLastPoint=points;tellRanking('point',{score:points});}
  function rankingFinish(){if(!rankActive)return;rankActive=false;rankPending=true;rankHUD();rankLoading('이번 기록 '+points+'점','점수와 순위를 저장하고 있어요…');tellRanking('finish',{score:points});}
  function showRankName(startAfter){
    rankStartAfterName=startAfter;rankPending=startAfter;rankHUD();openRankPanel(rankNickname?'이름 바꾸기':'순위에 사용할 별명');rankNameConfirmed=false;
    rankNameInput=rankNode('input');rankNameInput.setAttribute('aria-label','게임 닉네임');rankNameInput.placeholder='예: 별빛올빼미';rankNameInput.maxLength=80;rankNameInput.autocomplete='off';rankNameInput.value=rankNickname;
    rankNameStatus=rankNode('p','rank-status');rankNameStatus.setAttribute('role','status');
    rankNameSubmit=rankButton('닉네임 확인',()=>{
      if(rankNameConfirmed){closeRankPanel();if(rankStartAfterName)requestStart();return;}
      if(!rankNameInput.value.trim()){rankNameStatus.textContent='별명을 입력해 주세요.';return;}
      rankNameSubmit.disabled=true;rankNameInput.disabled=true;rankNameStatus.className='rank-status';rankNameStatus.textContent='별명을 확인하고 있어요…';tellRanking('nickname-submit',{nickname:rankNameInput.value});
    },true);
    rankNameBack=rankButton('돌아가기',()=>{if(rankNameConfirmed)showRankName(rankStartAfterName);else closeRankPanel();});
    const bar=rankNode('div','rank-buttons');bar.append(rankNameBack,rankNameSubmit);rankCard.append(rankNameInput,rankNameStatus,bar);
    rankNameInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing&&!rankNameSubmit.disabled){event.preventDefault();rankNameSubmit.click();}});rankNameInput.focus();
  }
  function showRankBoard(data){
    rankPending=false;rankHUD();openRankPanel(data.score===undefined?'순위':'이번 기록 '+data.score+'점');
    if(data.mine?.plays)rankCard.append(rankNode('p','','내 최고 '+data.mine.score+'점 · '+data.mine.rank+'위'));
    const entries=Array.isArray(data.entries)?data.entries.slice(0,5):[];
    if(entries.length){const wrap=rankNode('div','rank-table-wrap'),table=rankNode('table'),thead=rankNode('thead'),head=rankNode('tr');for(const title of ['순위','닉네임','점수'])head.append(rankNode('th','',title));thead.append(head);table.append(thead);const body=rankNode('tbody');for(const entry of entries){const row=rankNode('tr',entry.nickname===rankNickname?'mine':'');for(const text of [entry.rank+'위',entry.nickname,entry.score+'점'])row.append(rankNode('td','',text));body.append(row);}table.append(body);wrap.append(table);rankCard.append(wrap);}else rankCard.append(rankNode('p','','첫 기록을 남겨 보세요!'));
    const bar=rankNode('div','rank-buttons');bar.append(rankButton('이름 변경',()=>showRankName(false)));if(data.score!==undefined)bar.append(rankButton('다시 도전',()=>{closeRankPanel();ready();requestStart();},true));else bar.append(rankButton('게임으로',closeRankPanel,true));rankCard.append(bar);
  }
  function receiveLessonMessage(event){
    if(!embedded||event.source!==window.parent)return;
    const data=event.data;if(!data||typeof data!=='object')return;
    if(data.channel==='flappy-lesson'){
      if(data.command==='tap'){if(rankLayer&&!rankLayer.hidden)return;activateAudio();if(mode==='dead')replay();else press();}
      if(data.command==='restart'){rankPending=false;rankStartRequested=false;rankActive=false;rankLastPoint=0;closeRankPanel();ready();rankHUD();}
      return;
    }
    if(data.channel!=='flappy-ranking')return;
    if(data.command==='session'){rankNickname=typeof data.nickname==='string'?data.nickname:'';rankHUD();if(!rankNickname&&!rankActive)showRankName(true);}
    if(data.command==='identity'){rankNickname=typeof data.nickname==='string'?data.nickname:'';if(data.closeMenu&&rankNickname&&!rankActive)closeRankPanel();else rankHUD();}
    if(data.command==='nickname'&&!rankActive)showRankName(data.startAfter!==false);
    if(data.command==='nickname-approved'){
      rankNickname=typeof data.nickname==='string'?data.nickname:'';rankHUD();if(!rankNameInput||rankLayer.hidden)return;rankNameInput.value=rankNickname;rankNameInput.disabled=true;rankNameConfirmed=true;rankNameStatus.className='rank-status';rankNameStatus.textContent=data.changed?'새 별명으로 바꿨어요: '+rankNickname:'사용할 별명: '+rankNickname;rankNameSubmit.textContent=rankStartAfterName?'이 이름으로 시작':'사용하기';rankNameSubmit.disabled=false;rankNameBack.textContent='다시 입력';
    }
    if(data.command==='nickname-error'){if(rankNameInput)rankNameInput.disabled=false;if(rankNameSubmit)rankNameSubmit.disabled=false;if(rankNameStatus){rankNameStatus.className='rank-status error';rankNameStatus.textContent=data.message||'다시 확인해 주세요.';}}
    if(data.command==='start-approved'){if(!rankStartRequested||!rankPending||rankActive||mode!=='ready')return;rankPending=false;rankStartRequested=false;rankActive=true;rankLastPoint=0;rankLayer.hidden=true;rankHUD();start();canvas.focus({preventScroll:true});}
    if(data.command==='start-denied'){if(!rankStartRequested||!rankPending||rankActive)return;rankPending=false;rankStartRequested=false;rankHUD();openRankPanel('다시 시작해 주세요');rankCard.append(rankNode('p','',data.message||'잠시 뒤 다시 시도해 주세요.'),rankButton('돌아가기',closeRankPanel,true));}
    if(data.command==='rankings')showRankBoard(data);
    if(data.command==='rankings-loading'){rankPending=true;rankHUD();rankLoading('기록 확인 중','점수와 순위를 저장하고 있어요…');}
    if(data.command==='rankings-error'){rankPending=false;rankHUD();openRankPanel('기록을 확인해 주세요');rankCard.append(rankNode('p','',data.message||'연결을 다시 확인해 주세요.'));const bar=rankNode('div','rank-buttons');bar.append(rankButton('돌아가기',closeRankPanel),rankButton('다시 시도',()=>{rankPending=true;rankHUD();rankLoading('기록 확인 중','다시 연결하고 있어요…');tellRanking(data.canRetry?'retry-finish':'leaderboard-request');},true));rankCard.append(bar);}
  }
  function setupRanking(){
    if(!embedded)return;
    const container=document.getElementById('gamecontainer');rankHud=rankNode('div','rank-hud');rankNameLabel=rankNode('span');rankNameLabel.setAttribute('aria-label','현재 닉네임');rankNameButton=rankButton('이름 입력',()=>showRankName(false));rankBoardButton=rankButton('순위',()=>{rankPending=true;rankHUD();rankLoading('순위','기록을 불러오고 있어요…');tellRanking('leaderboard-request');});rankHud.append(rankNameLabel,rankNameButton,rankBoardButton);
    rankLayer=rankNode('section','rank-layer');rankLayer.hidden=true;rankLayer.setAttribute('role','dialog');rankLayer.setAttribute('aria-modal','true');rankLayer.setAttribute('aria-label','닉네임과 순위');rankCard=rankNode('div','rank-card');rankLayer.append(rankCard);container.append(rankHud,rankLayer);
    for(const type of ['pointerdown','mousedown','touchstart','click','keydown'])for(const layer of [rankHud,rankLayer])layer.addEventListener(type,event=>event.stopPropagation());rankHUD();
  }
  setupRanking();window.addEventListener('message',receiveLessonMessage);

  canvas.addEventListener('pointerdown',event=>{if(event.button!==0||(rankLayer&&!rankLayer.hidden))return;event.preventDefault();activateAudio();canvas.focus({preventScroll:true});if(mode==='dead'){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*320/rect.width,yy=(event.clientY-rect.top)*525/rect.height;if(x>=120&&x<=200&&yy>=280&&yy<=330)replay();}else press();});
  window.addEventListener('keydown',event=>{if(event.code!=='Space'||(rankLayer&&!rankLayer.hidden))return;event.preventDefault();activateAudio();if(mode==='dead')replay();else press();});
  ready();requestAnimationFrame(render);
})();
</script>
</body>
