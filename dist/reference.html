    rectangle(0,wingY,7,7,'#453044');rectangle(27,wingY,7,7,'#453044');rectangle(2,wingY+1,6,4,'#a86d50');rectangle(26,wingY+1,6,4,'#a86d50');rectangle(0,wingY+5,5,2,'#cf9667');rectangle(29,wingY+5,5,2,'#cf9667');
    rectangle(6,4,22,16,'#453044');rectangle(9,2,16,20,'#453044');rectangle(7,0,5,6,'#453044');rectangle(22,0,5,6,'#453044');
    rectangle(8,4,18,15,'#a56e50');rectangle(10,2,4,5,'#a56e50');rectangle(20,2,4,5,'#a56e50');rectangle(9,1,2,3,'#d69c70');rectangle(23,1,2,3,'#d69c70');rectangle(10,17,14,4,'#c08a5f');
    rectangle(8,6,8,10,'#f0d9ac');rectangle(6,8,12,6,'#f0d9ac');rectangle(19,6,8,10,'#f0d9ac');rectangle(17,8,12,6,'#f0d9ac');rectangle(8,7,8,1,'#fff0ce');rectangle(19,7,8,1,'#fff0ce');
    rectangle(10,9,5,6,'#332c39');rectangle(21,9,5,6,'#332c39');rectangle(11,9,2,2,'#fff5dc');rectangle(22,9,2,2,'#fff5dc');

  function floor(now){rectangle(0,420,320,105,'#353d55');rectangle(0,420,320,4,'#dbc4bd');rectangle(0,424,320,5,'#968697');rectangle(0,429,320,3,'#202f47');const offset=sceneTime(now)*(335/2516);for(let i=0;i<12;i++){const x=((i*34-offset)%408+408)%408-40;rectangle(x,434,29,13,'#4a4e68');rectangle(x+2,436,25,2,'#66667d');rectangle(x+15,450,28,17,'#454b64');rectangle(x+17,452,24,2,'#565b73');rectangle(x-2,470,31,18,'#3c465f');}rectangle(0,501,320,24,'#30394e');}

  function replayIcon(){g.strokeStyle='#f4ecda';g.lineWidth=4;g.beginPath();g.arc(160,302,13,-Math.PI*.2,Math.PI*1.47);g.stroke();g.fillStyle='#f4ecda';g.beginPath();g.moveTo(151,286);g.lineTo(162,286);g.lineTo(159,296);g.fill();}

  function render(now){
    if(mode==='resetting'&&now-resetAt>=1000)ready();
    g.imageSmoothingEnabled=false;sky(now);const motionTime=sceneTime(now);
    for(const actor of actors){if(actor.x>C.width+24||actor.x< -24)continue;if(actor.kind==='coin')coin(actor,motionTime);else cloud(actor);}
    let drawY=visualY,drawAngle=angle;if(mode==='dead'||mode==='resetting'){const p=Math.min(1,(now-deadAt)/1000),ease=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;drawY=fallFrom+Math.max(0,C.field-C.hitH-(C.spriteH-C.hitH)/2-fallFrom)*ease;drawAngle=fallAngle+(90-fallAngle)*ease;}
    character(drawY,drawAngle,motionTime);floor(now);
    if(mode==='playing')number(points,160,22,5);else if(mode==='ready'){number(0,160,22,5);tapIcon(now);}else if(mode==='dead'&&now-deadAt>=1000){g.fillStyle='#273550d9';g.fillRect(96,184,128,148);number(points,160,202,5);trophy(135,236);number(best,171,239,2,'#e6d4a3');medalIcon(medal(points));replayIcon();}
    requestAnimationFrame(render);
  }
  // Lesson controls are accepted only from the actual containing window.
  const embedded=window.parent!==window;
  function receiveLessonMessage(event){
    if(!embedded||event.source!==window.parent)return;const data=event.data;if(!data||typeof data!=='object'||data.channel!=='flappy-lesson')return;
    if(data.command==='tap'){activateAudio();if(mode==='dead')replay();else press();}
    if(data.command==='restart')ready();
  }
  window.addEventListener('message',receiveLessonMessage);
  canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();activateAudio();canvas.focus({preventScroll:true});if(mode==='dead'){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*320/rect.width,yy=(event.clientY-rect.top)*525/rect.height;if(x>=120&&x<=200&&yy>=280&&yy<=330)replay();}else press();});
  window.addEventListener('keydown',event=>{if(event.code!=='Space')return;event.preventDefault();activateAudio();if(mode==='dead')replay();else press();});
  ready();requestAnimationFrame(render);
})();
