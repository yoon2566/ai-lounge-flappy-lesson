data.channel!=='flappy-ranking')return;\n    if(data.command==='session'){rankNickname=typeof data.nickname==='string'?data.nickname:'';rankHUD();if(!rankNickname&&!rankActive)showRankName(true);}\n    if(data.command==='identity'){rankNickname=typeof data.nickname==='string'?data.nickname:'';if(data.closeMenu&&rankNickname&&!rankActive)closeRankPanel();else rankHUD();}\n    if(data.command==='nickname'&&!rankActive)showRankName(data.startAfter!==false);\n    if(data.command==='nickname-approved'){\n      rankNickname=typeof data.nickname==='string'?data.nickname:'';rankHUD();if(!rankNameInput||rankLayer.hidden)return;rankNameInput.value=rankNickname;rankNameInput.disabled=true;rankNameConfirmed=true;rankNameStatus.className='rank-status';rankNameStatus.textContent=data.changed?'새 별명으로 바꿨어요: '+rankNickname:'사용할 별명: '+rankNickname;rankNameSubmit.textContent=rankStartAfterName?'이 이름으로 시작':'사용하기';rankNameSubmit.disabled=false;rankNameBack.textContent='다시 입력';\n    }\n    if(data.command==='nickname-error'){if(rankNameInput)rankNameInput.disabled=false;if(rankNameSubmit)rankNameSubmit.disabled=false;if(rankNameStatus){rankNameStatus.className='rank-status error';rankNameStatus.textContent=data.message||'다시 확인해 주세요.';}}\n    if(data.command==='start-approved'){if(!rankStartRequested||!rankPending||rankActive||mode!=='ready')return;rankPending=false;rankStartRequested=false;rankActive=true;rankLastPoint=0;rankLayer.hidden=true;rankHUD();start();canvas.focus({preventScroll:true});}\n    if(data.command==='start-denied'){if(!rankStartRequested||!rankPending||rankActive)return;rankPending=false;rankStartRequested=false;rankHUD();openRankPanel('다시 시작해 주세요');rankCard.append(rankNode('p','',data.message||'잠시 뒤 다시 시도해 주세요.'),rankButton('돌아가기',closeRankPanel,true));}\n    if(data.command==='rankings')showRankBoard(data);\n    if(data.command==='rankings-loading'){rankPending=true;rankHUD();rankLoading('기록 확인 중','점수와 순위를 저장하고 있어요…');}\n    if(data.command==='rankings-error'){rankPending=false;rankHUD();openRankPanel('기록을 확인해 주세요');rankCard.append(rankNode('p','',data.message||'연결을 다시 확인해 주세요.'));const bar=rankNode('div','rank-buttons');bar.append(rankButton('돌아가기',closeRankPanel),rankButton('다시 시도',()=>{rankPending=true;rankHUD();rankLoading('기록 확인 중','다시 연결하고 있어요…');tellRanking(data.canRetry?'retry-finish':'leaderboard-request');},true));rankCard.append(bar);}\n  }\n  function setupRanking(){\n    if(!embedded)return;\n    const container=document.getElementById('gamecontainer');rankHud=rankNode('div','rank-hud');rankNameLabel=rankNode('span');rankNameLabel.setAttribute('aria-label','현재 닉네임');rankNameButton=rankButton('이름 입력',()=>showRankName(false));rankBoardButton=rankButton('순위',()=>{rankPending=true;rankHUD();rankLoading('순위','기록을 불러오고 있어요…');tellRanking('leaderboard-request');});rankHud.append(rankNameLabel,rankNameButton,rankBoardButton);\n    rankLayer=rankNode('section','rank-layer');rankLayer.hidden=true;rankLayer.setAttribute('role','dialog');rankLayer.setAttribute('aria-modal','true');rankLayer.setAttribute('aria-label','닉네임과 순위');rankCard=rankNode('div','rank-card');rankLayer.append(rankCard);container.append(rankHud,rankLayer);\n    for(const type of ['pointerdown','mousedown','touchstart','click','keydown'])for(const layer of [rankHud,rankLayer])layer.addEventListener(type,event=>event.stopPropagation());rankHUD();\n  }\n  setupRanking();window.addEventListener('message',receiveLessonMessage);\n\n  canvas.addEventListener('pointerdown',event=>{if(event.button!==0||(rankLayer&&!rankLayer.hidden))return;event.preventDefault();activateAudio();canvas.focus({preventScroll:true});if(mode==='dead'){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*320/rect.width,yy=(event.clientY-rect.top)*525/rect.height;if(x>=120&&x\u003c=200&&yy>=280&&yy\u003c=330)replay();}else press();});\n  window.addEventListener('keydown',event=>{if(event.code!=='Space'||(rankLayer&&!rankLayer.hidden))return;event.preventDefault();activateAudio();if(mode==='dead')replay();else press();});\n  ready();requestAnimationFrame(render);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","practice":"\u003c!doctype html>\n\u003c!--\n2026-10-31. 승인된 별빛 비행의 자체 제작 코드·배경·올빼미 스프라이트를 사용하는 코인 연습판.\n기존 수업 연습판의 코인·구름 생성 범위, 속도, 간격과 수집·위험 판정을 유지한다.\n플레이어는 승인된 올빼미의 고정 20×20 충돌 영역을 사용한다. 원작 이미지·음원·폰트는 포함하지 않는다.\n효과음은 Web Audio로 합성한다. 닉네임·랭킹·네트워크·영구 저장 없이 동작한다.\n-->\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n\u003cmeta name=\"theme-color\" content=\"#171f36\">\n\u003ctitle>별빛 코인 비행\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171f36;overscroll-behavior:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,calc(100dvh * 320 / 525));height:min(100dvh,calc(100vw * 525 / 320));aspect-ratio:320/525;image-rendering:pixelated;touch-action:none;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}\n#gamecontainer{position:relative;width:min(100vw,calc(100dvh * 320 / 525));height:min(100dvh,calc(100vw * 525 / 320));overflow:hidden}#gamecontainer>canvas{width:100%;height:100%}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain id=\"gamecontainer\" data-flappy-source=\"owl-v2\">\n\u003ccanvas id=\"game\" width=\"320\" height=\"525\" tabindex=\"0\" aria-label=\"별빛 코인 비행. 스페이스바 또는 화면을 눌러 코인을 모으세요. 검은 구름과 땅에 닿으면 끝납니다.\">\u003c/canvas>\n\u003cdiv id=\"status\" class=\"sr\" role=\"status\" aria-live=\"polite\" data-state=\"ready\">준비\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\n(() => {\n  const C=Object.freeze({width:320,height:525,field:420,left:60,spriteW:34,spriteH:24,pivotX:18,pivotY:12,hitW:20,hitH:20,initialY:180,gravity:.25,impulse:-4.6,tick:1000/60});\n unction spawn(kind,x,height){const actor={kind,x,y:height};actors.push(actor);return actor;}\n  function clearOfOpposite(kind,x,height){return !actors.some(actor=>actor.kind!==kind&&Math.abs(actor.x-x)\u003c90&&Math.abs(actor.y-height)\u003c55);}\n  function spawnNext(kind){\n    const x=P.spawnX+Math.random()*P.spawnJitter;let height=pickHeight(kind),tries=0;\n    while(tries\u003c4&&!clearOfOpposite(kind,x,height)){height=pickHeight(kind);tries++;}\n    if(!clearOfOpposite(kind,x,height)){if(kind==='coin')nextCoin=P.coinRetry;else nextCloud=P.cloudRetry;return;}\n    spawn(kind,x,height);\n    if(kind==='coin'){lastCoinY=height;nextCoin=P.coinInterval+Math.random()*P.coinIntervalJitter;}else{lastCloudY=height;nextCloud=P.cloudInterval+Math.random()*P.cloudIntervalJitter;}\n  }\n  function updateActors(dt,now,hit=bounds()){\n    nextCoin-=dt;nextCloud-=dt;if(nextCoin\u003c=0)spawnNext('coin');if(nextCloud\u003c=0)spawnNext('cloud');\n    for(let i=actors.length-1;i>=0;i--){const actor=actors[i];actor.x-=dt*(actor.kind==='coin'?P.coinSpeed:P.cloudSpeed);\n      if(actor.kind==='cloud'&&cloudTouch(hit,actor)){finish(now);return;}\n      if(actor.kind==='coin'&&coinTouch(hit,actor)){actors.splice(i,1);points++;status.textContent='비행 중. 점수 '+points;sound('score');continue;}\n      if(actor.x\u003cP.removeX)actors.splice(i,1);\n    }\n  }\n  function finish(now){if(mode!=='playing')return;stoppedAt=now;deadAt=now;fallFrom=visualY;fallAngle=angle;stopTimers();best=Math.max(best,points);setMode('dead');sound('hit');}\n  function step(now){\n    if(mode!=='playing')return;\n    velocity+=C.gravity;y+=velocity;angle=Math.min(velocity*9,90);visualY=y;\n    const hit=bounds();\n    if(hit.bottom>=C.field){y=C.field-C.hitH-(C.spriteH-C.hitH)/2;visualY=y;finish(now);return;}\n    const dt=Math.min(P.maxDt,Math.max(0,(now-lastUpdate)/1000));lastUpdate=now;updateActors(dt,now,hit);\n  }\n  function replay(){if(mode!=='dead'||clock()-deadAt\u003c1000)return;resetAt=clock();setMode 597');rectangle(x-7,y-6,2,7,'#fff0b5');rectangle(x+5,y+2,2,5,'#d28b31');if(Math.floor(now/140)%4===0){rectangle(x-5,y-8,6,2,'#fff4d0');rectangle(x-3,y-10,2,6,'#fff4d0');}\n  }\n  function cloud(actor){\n    const x=actor.x,y=actor.y;rectangle(x-18,y-8,36,22,'#080d17');rectangle(x-24,y-3,48,13,'#080d17');rectangle(x-11,y-16,22,28,'#080d17');rectangle(x-21,y-4,12,12,'#171d29');rectangle(x-8,y-13,16,23,'#171d29');rectangle(x+9,y-7,11,17,'#171d29');rectangle(x-15,y+1,31,11,'#121823');rectangle(x-7,y-12,12,2,'#343e50');rectangle(x-20,y-3,8,2,'#293343');rectangle(x+11,y-6,6,2,'#293343');rectangle(x-17,y+11,34,3,'#080d17');\n  }\n  function character(top,rotation,now){g.save();g.translate(C.left+C.pivotX,top+C.pivotY);g.rotate(rotation*Math.PI/180);g.translate(-C.pivotX,-C.pivotY);\n    if(owlSpriteReady&&owlSprite&&owlSprite.complete&&owlSprite.naturalWidth===272&&owlSprite.naturalHeight===48){\n      try{const frame=Math.floor(now/75)%4;g.drawImage(owlSprite,frame*68,0,68,48,0,0,34,24);g.restore();return;}catch{owlSpriteReady=false;}\n    }\n    drawOwlFallback(now);g.restore();\n  }\n  function drawOwlFallback(now){\n    const wingY=[3,8,13,8][Math.floor(now/75)%4];\n    rectangle(0,wingY,7,7,'#453044');rectangle(27,wingY,7,7,'#453044');rectangle(2,wingY+1,6,4,'#a86d50');rectangle(26,wingY+1,6,4,'#a86d50');rectangle(0,wingY+5,5,2,'#cf9667');rectangle(29,wingY+5,5,2,'#cf9667');\n    rectangle(6,4,22,16,'#453044');rectangle(9,2,16,20,'#453044');rectangle(12,1,10,3,'#453044');\n    rectangle(8,4,18,15,'#a56e50');rectangle(11,3,12,4,'#a56e50');rectangle(14,2,6,2,'#d69c70');rectangle(10,17,14,4,'#c08a5f');\n    rectangle(8,6,8,10,'#f0d9ac');rectangle(6,8,12,6,'#f0d9ac');rectangle(19,6,8,10,'#f0d9ac');rectangle(17,8,12,6,'#f0d9ac');rectangle(8,7,8,1,'#fff0ce');rectangle(19,7,8,1,'#fff0ce');\n    rectangle(10,9,5,6,'#332c39');rectangle(21,9,5,6,'#332c39');rectangle(11,9,2,2,'#fff5dc');rectangle(22,9,2,2,'#fff5dc');\n    rectangle(16,13,4,3,'#e7ad58');rectangle(17,16,2,2,'#ca79 n    for(const actor of actors){if(actor.x>C.width+24||actor.x\u003c -24)continue;if(actor.kind==='coin')coin(actor,motionTime);else cloud(actor);}\n    let drawY=visualY,drawAngle=angle;if(mode==='dead'||mode==='resetting'){const p=Math.min(1,(now-deadAt)/1000),ease=p\u003c.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;drawY=fallFrom+Math.max(0,C.field-C.hitH-(C.spriteH-C.hitH)/2-fallFrom)*ease;drawAngle=fallAngle+(90-fallAngle)*ease;}\n    character(drawY,drawAngle,motionTime);floor(now);\n    if(mode==='playing')number(points,160,22,5);else if(mode==='ready'){number(0,160,22,5);tapIcon(now);}else if(mode==='dead'&&now-deadAt>=1000){g.fillStyle='#273550d9';g.fillRect(96,184,128,148);number(points,160,202,5);trophy(135,236);number(best,171,239,2,'#e6d4a3');medalIcon(medal(points));replayIcon();}\n    requestAnimationFrame(render);\n  }\n  // Lesson controls are accepted only from the actual containing window.\n  const embedded=window.parent!==window;\n  function receiveLessonMessage(event){\n    if(!embedded||event.source!==window.parent)return;const data=event.data;if(!data||typeof data!=='object'||data.channel!=='flappy-lesson')return;\n    if(data.command==='tap'){activateAudio();if(mode==='dead')replay();else press();}\n    if(data.command==='restart')ready();\n  }\n  window.addEventListener('message',receiveLessonMessage);\n  canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();activateAudio();canvas.focus({preventScroll:true});if(mode==='dead'){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*320/rect.width,yy=(event.clientY-rect.top)*525/rect.height;if(x>=120&&x\u003c=200&&yy>=280&&yy\u003c=330)replay();}else press();});\n  window.addEventListener('keydown',event=>{if(event.code!=='Space')return;event.preventDefault();activateAudio();if(mode==='dead')replay();else press();});\n  ready();requestAnimationFrame(render);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"coinQuestions":[{"q":"돌기둥이 있나요?","se 은 만들지 마. HTML, CSS, JavaScript를 하나의 HTML 파일에 넣고 작은 화면에서도 실행되게 해 줘. 완성한 전체 HTML을 html 코드블록 하나로 출력해 줘.","id":"flappy-image-course-20261025-v1","slides":[{"id":"cover","type":"cover","title":"AI 이미지로\n내 게임 만들기","accent":"내 게임","body":"올빼미 게임을 해 보고,\n내 그림으로 게임을 바꿉니다.","pptBody":["올빼미 게임을 해 보고,","내 그림으로 게임을 바꿉니다."],"notes":"앞 차시 공룡 게임 제작 경험과 연결한다. 오늘은 게임 규칙을 먼저 만들고, 이미지 파일을 인터넷 주소로 연결한다."},{"id":"goals","type":"goals","title":"학습목표","accent":"학습","goals":["게임을 관찰하고 AI로 기본 게임을 만든다","배경·주인공·아이템·장애물을 만든다","내 그림으로 게임을 완성하고 게시한다"],"notes":"완성물은 외부 이미지 URL을 사용하는 단일 HTML 게임이다. 이미지 호스팅과 HTML 게임 파일의 차이를 결과물로 확인한다."},{"id":"vibe","type":"explanation","title":"바이브 코딩이란?","accent":"이란?","body":"만들고 싶은 것을 말로 설명하고,\nAI와 함께 실행하고 수정합니다.","flow":["관찰","문장","프롬프트","실행"],"pptBody":["만들고 싶은 것을 말로 설명하고,","AI와 함께 실행하고 수정합니다."],"notes":"1차시와 같은 표현을 사용한다. 처음부터 그림을 만들지 않고 게임의 움직임과 규칙부터 확인한다."},{"id":"intro","type":"intro","title":"플래피 버드 알아보기","accent":"플래피 버드","body":"2013년, 베트남 개발자 동 응우옌(Dong Nguyen)이 만든 모바일 게임입니다.","rules":["화면을 누르면 새가 올라가고,\n누르지 않으면 아래로 내려옵니다.","파이프 사이를 통과하면\n점수가 1점씩 오릅니다.","파이프나 바닥에 닿으면\n게임이 끝납니다."],"bridge":"다음 장에서는 직접 만든 올빼미 게임 ‘별빛 비행’을 해봅니다.","referenceURL":"https://github.com/nebez/floppybird","sourceURL":"https://www.vam.ac.uk/blog/news/the-rise-and-fall-of-flappy-bird-and-the-collecting-of-the-vas-first-app","pptBody":["플래피 버드는 화면을 눌러 새를 날리고 파이프 사이를 통과하는 모바일 게임입니다.","조작은 간단하지만 누르는 타이밍이 중요합니다.","다음 장에서는 별도로 제작한 올빼미 게임으로 같은 조작 방식을 체험합니다."],"notes":"원작 Flappy Bird의 제작자·2013년 출시와 탭 조작은 V&A 박물관 소개 자료를 참고했다. 참고 화면은 이전 수업에서 사용한 nebez/floppybird 웹 재현판의 정적 캡처이며 원작 앱의 실제 캡처나 공식 웹사이트로 표기하지 않는다. 이 장은 소개용이고, 다음 장에서 실행하는 별빛 비행은 별도로 제작한 수업용 게임이다."},{"id":"classic","type":"play","title":"별빛 비행 해보기","accent":"해보기","mode":"classic","caption":"게임 화면을 누른 뒤 스페이스바·터치로 돌기둥 사이를 통과합니다.","pptBody":["버튼을 누르면 위로 날아오릅니다.","돌기둥 사이를 지나면 점수가 오릅니다.","돌기둥이나 바닥에 닿으면 끝납니다."],"notes":"별빛 비행은 직접 작성한 Canvas 코드와 별도 제작한 올빼미·배경·돌기둥, 합성 효과음을 사용하는 수업용 게임이다. 승인된 로컬판의 320×525 화면, 고정 20×20 히트박스, 중력 0.25, 상승 -4.6, 기둥 틈 120px, 생성 간격 1400ms를 유지한다. 기존 수업의 닉네임·점수·랭킹 기능과 연결한다."},{"id":"observe","type":"activity","title":"게임을 문장으로","accent":"문장으로","kind":"classic","pptBody":["질문에 답하고 모은 문장을 고칩니다.","프롬프트를 확인하고 게임을 만듭니다.","같은 창에서 실행하고 다음 단계로 갑니다."],"notes":"질문과 문장 확인, 프롬프트, 게임 실행은 이 한 장 안에서 진행합니다."},{"id":"base-check","type":"errors","title":"기본 게임 오류 고치기","accent":"오류","kind":"classic","body":"문제를 여러 개 고르거나 직접 적어 주세요.","pptBody":["문제를 고르고 증상을 직접 적습니다.","수정 프롬프트를 확인하고 다시 실행합니다.","문제가 없으면 다음 단계로 갑니다."]},{"id":"practice","type":"play","title":"코인 모으기 게임 해보기","accent":"코인","mode":"practice","caption":"공중의 코인을 먹으면 +1점! 작은 구름이나 땅에 닿으면 게임이 끝납니다.","pptBody":["공중의 코인을 먹으면 점수가 1점 오릅니다.","작은 구름이나 땅에 닿으면 게임이 끝납니다.","이름 입력과 점수 공유 없이 바로 즐깁니다."],"notes":"돌기둥 없이 코인을 모으며 작은 검은 구름 또는 바닥에 닿으면 종료합니다. 온라인 순위는 없습니다."},{"id":"coin-observe","type":"activity","title":"바뀐 게임을 문장으로","accent":"문장으로","kind":"coin","pptBody":["질문에 답하고 모은 문장을 고칩니다.","프롬프트를 확인하고 게임을 만듭니다.","같은 창에서 실행하고 다음 단계로 갑니다."],"notes":"질문과 문장 확인, 프롬프트, 게임 실행은 이 한 장 안에서 진행합니다."},{"id":"coin-check","type":"errors","title":"코인 게임 오류 고치기","accent":"오류","kind":"coin","body":"문제를 여러 개 고르거나 직접 적어 주세요.","pptBody":["문제를 고르고 증상을 직접 적습니다.","수정 프롬프트를 확인하고 다시 실행합니다.","문제가 없으면 다음 단계로 갑니다."]},{"id":"asset-plan","type":"assets","title":"내 게임에 필요한 이미지","accent":"이미지","body":"배경·주인공·아이템·장애물을 준비합니다.","pptBody":["배경 한 장, 주인공 두 프레임","모을 아이템과 피할 장애물","오른쪽 아래 시작하기를 누릅니다."],"notes":"배경 한 장, 주인공 두 프레임, 아이템과 장애물 각 한 장을 만든다. 주인공·아이템·장애물의 단색 바탕을 제거하고 자동으로 저장한다."},{"id":"background","type":"studio","title":"게임 배경 만들기","accent":"배경","kind":"background","body":"캐릭터와 아이템이 잘 보이는 장소를 고릅니다.","options":["구름이 있는 숲속 하늘","별이 보이는 우주","바다 위의 하늘"],"example":"background.webp","pptBody":["가로로 긴 2D 픽셀 배경을 만듭니다.","주인공·아이템·장애물은 배경에 그리지 않습니다.","배경의 바탕은 그대로 유지합니다."],"notes":"Recraft V4.1 Flash로 실제 이미지 생성. 양 끝이 자연스럽게 이어지도록 요청한다. 배경에는 투명 배경 제거를 적용하지 않는다."},{"id":"character","type":"studio","title":"게임 주인공 만들기","accent":"주인공","kind":"character","body":"주인공과 움직임 두 프레임을 한 번에 만듭니다.","options":["노란 몸과 파란 날개의 작은 새","날개 달린 아기 공룡","작은 추진기가 달린 로봇"],"example":"bird-frame-1.webp","pptBody":["주인공과 두 동작을 한 번에 만듭니다.","오른쪽을 보는 전신으로 만듭니다.","다음 장에서 같은 그림을 확인합니다."],"notes":"Recraft V4.1 Flash로 가로 두 칸을 한 번에 생성합니다. 첫 칸을 잘라 주인공 미리보기로 보여 주고 전체 이미지는 스프라이트로 저장합니다. 별도 참조 이미지 편집이나 추가 모델을 사용하지 않습니다. 동일 그림 안에서도 두 동작의 품질은 직접 확인합니다."},{"id":"sprite","type":"studio","title":"움직임 두 프레임 만들기","accent":"두 장","kind":"sprite","body":"앞에서 함께 만든 두 동작을 그대로 확인합니다.","options":["날개 위 / 날개 아래","다리 앞 / 다리 뒤","몸을 움츠림 / 몸을 폄"],"example":"bird-sprite.webp","pptBody":["앞에서 만든 같은 주인공의 두 동작을 확인합니다.","두 장 모두 오른쪽을 바라보게 합니다.","크기와 몸 위치를 같게 맞춥니다."],"notes":"13장에서 생성한 동일 이미지의 두 프레임을 확인합니다. 이 장에서는 AI를 다시 호출하지 않습니다. 다시 만들기는 13장으로 돌아갑니다. 새로운 주인공을 생성하면 이전 투명 스프라이트와 이미지 URL을 재사용하지 않습니다."},{"id":"item","type":"studio","title":"모을 아이템 만들기","accent":"아이템","kind":"item","body":"작게 보여도 알아볼 수 있는 아이템을 고릅니다.","options":["반짝이는 금색 동전","밝은 노란 별","초록색 에너지 보석"],"example":"coin.webp","pptBody":["동전·별·보석 중 하나를 고릅니다.","아이템 한 개만 크게 그립니다.","주인공과 같은 픽셀 스타일을 씁니다."],"notes":"아이템은 회전 애니메이션 없이 한 장으로도 충분하다. 주인공과 아이템은 같은 단색 크로마키 바탕으로 요청하면 배경 제거가 쉽다."},{"id":"obstacle","type":"studio","kind":"obstacle","title":"피할 장애물 만들기","accent":"장애물","body":"닿으면 게임이 끝나는 그림을 만듭니다.","options":["먹구름","작은 운석","뾰족한 바위"],"example":"coin.webp","pptBody":["피해야 할 그림을 고르거나 직접 적습니다.","Haiku가 바꾼 프롬프트를 확인합니다.","그림을 만들고 다음 단계로 갑니다."],"notes":"아이템은 점수, 장애물은 충돌 종료라는 역할을 구분한다. Flash로 단색 바탕에 하나를 생성한다."},{"id":"remove","type":"remove","title":"그림의 배경 제거하기","accent":"배경 제거","body":"주인공·아이템·장애물의 단색 바탕을 지웁니다.","pptBody":["세 그림의 단색 바탕을 제거합니다.","자동으로 저장할 때까지 기다립니다.","준비가 끝나면 다음 단계로 갑니다."],"notes":"원본을 보존하고 투명 처리와 자동 호스팅을 진행한다. 실패하면 재시도한다. 별도 주소 만들기 장은 없다."},{"id":"webp","type":"sprite-preview","title":"투명 WebP와 움직임 확인하기","accent":"WebP","body":"두 동작을 번갈아 보고 직접 조절합니다.","pptBody":["몸 중심과 크기가 이어지는지 봅니다.","필요하면 각 프레임 위치와 크기를 조절합니다.","동작이 같으면 요청문을 고쳐 다시 만듭니다."],"notes":"정규화가 새로운 동작을 만들지는 않는다. Flash는 두 동작이 같거나 형태가 달라질 수 있다. 실제 미리보기로 확인하고 동작이 분명한지 학생이 판단한다."},{"id":"apply-bg","type":"apply","title":"배경 그림 적용하기","accent":"배경","kind":"background","body":"게임 규칙을 유지하고 배경 그림만 바꿉니다.","pptBody":["준비된 배경 그림을 확인합니다.","화면 전체에 배경이 보이게 합니다.","왼쪽으로 천천히 반복되게 합니다."],"notes":"이미지 생성 프롬프트와 기존 HTML을 수정하는 프롬프트를 구분한다. 기존 HTML 전체를 함께 전달하며 요청하지 않은 게임 규칙을 유지한다."},{"id":"apply-sprite","type":"apply","title":"주인공 스프라이트 적용하기","accent":"스프라이트","kind":"sprite","body":"이미지의 두 칸을 번갈아 보여 주도록 요청합니다.","pptBody":["스프라이트 전체 크기를 알려 줍니다.","가로 두 칸을 번갈아 보여 줍니다.","두 캐릭터가 동시에 나오지 않게 확인합니다."],"notes":"스프라이트 한 칸의 너비는 전체 너비÷2, 높이는 전체 높이다. 두 프레임을 약 0.13~0.18초 간격으로 번갈아 그리도록 한다. 투명 여백을 포함한 사각형 전체로 충돌을 계산하지 않도록 요청한다."},{"id":"apply-item","type":"apply","title":"아이템 그림 적용하기","accent":"아이템","kind":"item","body":"아이템 그림을 바꾸고 획득 규칙을 유지합니다.","pptBody":["준비된 아이템 그림을 확인합니다.","동전의 그림만 내가 만든 그림으로 바꿉니다.","닿으면 사라지고 점수가 오르게 합니다."],"notes":"아이템 그림은 바꾸되 획득 점수·생성 간격·게임 목표는 유지한다. 학생이 별을 골랐다면 화면 문구도 별로 바꾸는 선택을 할 수 있다."},{"id":"apply-obstacle","type":"apply","kind":"obstacle","title":"장애물 그림 적용하기","accent":"장애물","body":"검은 구름 대신 내가 만든 장애물을 넣습니다.","pptBody":["준비된 장애물 그림을 확인합니다.","프롬프트를 확인한 뒤 게임을 수정합니다.","닿으면 끝나는 규칙을 확인합니다."],"notes":"아이템 +1점, 바닥 충돌과 재시작은 유지한다. 기존 구름의 충돌과 생성 로직에 새 이미지를 적용한다."},{"id":"final","type":"play","title":"내 이미지로 게임하기","accent":"내 이미지","mode":"final","caption":"내 그림, 아이템 점수, 장애물·바닥 충돌을 확인합니다.","pptBody":["배경·주인공·아이템·장애물이 보이나요?","아이템은 +1점, 장애물과 바닥은 종료인가요?","수정하기로 현재 게임을 다듬습니다."],"notes":"학생의 최신 HTML을 실행합니다."},{"id":"repair","type":"errors","title":"이미지 적용 후 오류 고치기","accent":"오류","kind":"image","body":"문제를 여러 개 고르거나 직접 적어 주세요.","pptBody":["문제를 고르고 증상을 직접 적습니다.","수정 프롬프트를 확인하고 다시 실행합니다.","문제가 없으면 다음 단계로 갑니다."]},{"id":"share","type":"share","title":"완성한 게임 게시하기","accent":"게시하기","steps":["이름 또는 닉네임과 작품 제목을 적습니다.","현재 완성 게임을 게시합니다.","게시판에서 친구 작품을 열어 봅니다."],"pptBody":["이름 또는 닉네임과 작품 제목을 적습니다.","현재 완성 게임을 게시합니다.","게시판에서 친구 작품을 열어 봅니다."],"notes":"플래피 전용 게시판에 현재 HTML을 저장한다. 이미지 URL은 유지된다. 이름 대신 닉네임을 사용할 수 있고, 게시판은 주소를 아는 사람이 볼 수 있다. 동일 이름·제목·HTML의 중복 게시를 막는다."}],"assets":{"background.webp":"/static/background.c82e595c4efa.webp","background-cover.webp":"/static/background-cover.517d089c2f91.webp","bird-frame-1.webp":"/static/bird-frame-1.1ef00c2d1610.webp","bird-frame-2.webp":"/static/bird-frame-2.11f76ba4331d.webp","bird-sprite.webp":"/static/bird-sprite.02f7bc2bcdd0.webp","bird-original.webp":"/static/bird-original.413233b61b66.webp","coin.webp":"/static/coin.fb39dc4f9e55.webp","coin-original.webp":"/static/coin-original.71e05afa28d1.webp","game-classic.png":"/static/game-classic.122942fd8472.png","flappy-reference.png":"/static/flappy-reference.6174b0161367.png"},"gameDocument":"\u003c!doctype html>\n\u003c!--\n2026-10-31. 승인된 별빛 비행의 자체 제작 코드·배경·올빼미 스프라이트를 사용하는 코인 연습판.\n기존 수업 연습판의 코인·구름 생성 범위, 속도, 간격과 수집·위험 판정을 유지한다.\n플레이어는 승인된 올빼미의 고정 20×20 충돌 영역을 사용한다. 원작 이미지·음원·폰트는 포함하지 않는다.\n효과음은 Web Audio로 합성한다. 닉네임·랭킹·네트워크·영구 저장 없이 동작한다.\n-->\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n\u003cmeta name=\"theme-color\" content=\"#171f36\">\n\u003ctitle>별빛 코인 비행\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171f36;overscroll-behavior:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,calc(100dvh * 320 / 525));height:min(100dvh,calc(100vw * 525 / 320));aspect-ratio:320/525;image-rendering:pixelated;touch-action:none;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}\n#gamecontainer{position:relative;width:min(100vw,calc(100dvh * 320 / 525));height:min(100dvh,calc(100vw * 525 / 320));overflow:hidden}#gamecontainer>canvas{width:100%;height:100%}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain id=\"gamecontainer\" data-flappy-source=\"owl-v2\">\n\u003ccanvas id=\"game\" width=\"320\" height=\"525\" tabin e(x,384-(i%3)*17,49,39+(i%3)*17,'#586480');rectangle(x+5,379-(i%3)*17,17,5,'#68738a');rectangle(x+33,376-(i%3)*17,10,8,'#68738a');}\n  }\n\n  function coin(actor,now){\n    const x=actor.x,y=actor.y;rectangle(x-8,y-12,16,24,'#6f482b');rectangle(x-12,y-8,24,16,'#6f482b');rectangle(x-7,y-10,14,20,'#f5c965');rectangle(x-10,y-7,20,14,'#e5a63e');rectangle(x-7,y-9,14,18,'#f4c35a');rectangle(x-4,y-8,8,16,'#ba782e');rectangle(x-2,y-7,4,14,'#ffe597');rectangle(x-7,y-6,2,7,'#fff0b5');rectangle(x+5,y+2,2,5,'#d28b31');if(Math.floor(now/140)%4===0){rectangle(x-5,y-8,6,2,'#fff4d0');rectangle(x-3,y-10,2,6,'#fff4d0');}\n  }\n  function cloud(actor){\n    const x=actor.x,y=actor.y;rectangle(x-18,y-8,36,22,'#080d17');rectangle(x-24,y-3,48,13,'#080d17');rectangle(x-11,y-16,22,28,'#080d17');rectangle(x-21,y-4,12,12,'#171d29');rectangle(x-8,y-13,16,23,'#171d29');rectangle(x+9,y-7,11,17,'#171d29');rectangle(x-15,y+1,31,11,'#121823');rectangle(x-7,y-12,12,2,'#343e50');rectangle(x-20,y-3,8,2,'#293343');rectangle(x+11,y-6,6,2,'#293343');rectangle(x-17,y+11,34,3,'#080d17');\n  }\n  function character(top,rotation,now){g.save();g.translate(C.left+C.pivotX,top+C.pivotY);g.rotate(rotation*Math.PI/180);g.translate(-C.pivotX,-C.pivotY);\n    if(owlSpriteReady&&owlSprite&&owlSprite.complete&&owlSprite.naturalWidth===272&&owlSprite.naturalHeight===48){\n      try{const frame=Math.floor(now/75)%4;g.drawImage(owlSprite,frame*68,0,68,48,0,0,34,24);g.restore();return;}catch{owlSpriteReady=false;}\n    }\n    drawOwlFallback(now);g.restore();\n  }\n  function drawOwlFallback(now){\n    const wingY=[3,8,13,8][Math.floor(now/75)%4];\n    rectangle(0,wingY,7,7,'#453044');rectangle(27,wingY,7,7,'#453044');rectangle(2,wingY+1,6,4,'#a86d50');rectangle(26,wingY+1,6,4,'#a86d50');rectangle(0,wingY+5,5,2,'#cf9667');rectangle(29,wingY+5,5,2,'#cf9667');\n    rectangle(6,4,22,16,'#453044');rectangle(9,2,16,20,'#453044');rectangle(12,1,10,3,'#453044');\n    rectangle(8,4,18,15,'#a56e50');rectangle(11,3,12,4,'#a56e50');rectangle(14,2,6,2,'#d69c70');rectangle(10,17,14,4,'#c08a5f');\n    rectangle(8,6,8,10,'#f0d9ac');rectangle(6,8,12,6,'#f0d9ac');rectangle(19,6,8,10,'#f0d9ac');rectangle(17,8,12,6,'#f0d9ac');rectangle(8,7,8,1,'#fff0ce');rectangle(19,7,8,1,'#fff0ce');\n    rectangle(10,9,5,6,'#332c39');rectangle(21,9,5,6,'#332c39');rectangle(11,9,2,2,'#fff5dc');rectangle(22,9,2,2,'#fff5dc');\n    rectangle(16,13,4,3,'#e7ad58');rectangle(17,16,2,2,'#ca7947');rectangle(12,18,2,2,'#efcf9f');rectangle(17,19,2,2,'#efcf9f');rectangle(21,18,2,2,'#efcf9f');rectangle(11,21,4,3,'#d8a06a');rectangle(21,21,4,3,'#d8a06a');\n  }\n  function floor(now){rectangle(0,420,320,105,'#353d55');rectangle(0,420,320,4,'#dbc4bd');rectangle(0,424,320,5,'#968697');rectangle(0,429,320,3,'#202f47');const offset=sceneTime(now)*(335/2516);for(let i=0;i\u003c12;i++){const x=((i*34-offset)%408+408)%408-40;rectangle(x,434,29,13,'#4a4e68');rectangle(x+2,436,25,2,'#66667d');rectangle(x+15,450,28,17,'#454b64');rectangle(x+17,452,24,2,'#565b73');rectangle(x-2,470,31,18,'#3c465f');}rectangle(0,501,320,24,'#30394e');}\n  function tapIcon(now){const lift=Math.sin(now/330)*2;g.save();g.globalAlpha=.88;rectangle(151,250+lift,5,20,'#e5e6dc');rectangle(145,259+lift,6,14,'#e5e6dc');rectangle(156,259+lift,8,15,'#e5e6dc');rectangle(148,273+lift,14,7,'#e5e6dc');rectangle(148,241+lift,11,3,'#e5e6dc');rectangle(144,245+lift,4,3,'#e5e6dc');rectangle(159,245+lift,4,3,'#e5e6dc');g.restore();}\n  function trophy(x,y){rectangle(x+2,y,10,8,'#e6c67f');rectangle(x+4,y+8,6,3,'#d0aa65');rectangle(x+6,y+11,2,4,'#e6c67f');rectangle(x+3,y+15,8,2,'#e6c67f');rectangle(x,y+2,2,5,'#b79b6a');rectangle(x+12,y+2,2,5,'#b79b6a');rectangle(x+1,y+7,3,2,'#b79b6a');rectangle(x+10,y+7,3,2,'#b79b6a');}\n  function medalIcon(level){if(!level)return;const color=['','#d58c66','#c4d6e1','#f1cd76','#86e2d5'][level];rectangle(153,263,5,14,'#617895');rectangle(162,263,5,14,'#617895');rectangle(155,260,10,14,color);rectangle(152,263,16,8,color);rectangle(157,263,6,8,'#fff3d866');rectangle(155,266,10,2,'#fff3d866');}\n  function replayIcon(){g.strokeStyle='#f4ecda';g.lineWidth=4;g.beginPath();g.arc(160,302,13,-Math.PI*.2,Math.PI*1.47);g.stroke();g.fillStyle='#f4ecda';g.beginPath();g.moveTo(151,286);g.lineTo(162,286);g.lineTo(159,296);g.fill();}\n\n  function render(now){\n    if(mode==='resetting'&&now-resetAt>=1000)ready();\n    g.imageSmoothingEnabled=false;sky(now);const motionTime=sceneTime(now);\n    for(const actor of actors){if(actor.x>C.width+24||actor.x\u003c -24)continue;if(actor.kind==='coin')coin(actor,motionTime);else cloud(actor);}\n    let drawY=visualY,drawAngle=angle;if(mode==='dead'||mode==='resetting'){const p=Math.min(1,(now-deadAt)/1000),ease=p\u003c.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;drawY=fallFrom+Math.max(0,C.field-C.hitH-(C.spriteH-C.hitH)/2-fallFrom)*ease;drawAngle=fallAngle+(90-fallAngle)*ease;}\n    character(drawY,drawAngle,motionTime);floor(now);\n    if(mode==='playing')number(points,160,22,5);else if(mode==='ready'){number(0,160,22,5);tapIcon(now);}else if(mode==='dead'&&now-deadAt>=1000){g.fillStyle='#273550d9';g.fillRect(96,184,128,148);number(points,160,202,5);trophy(135,236);number(best,171,239,2,'#e6d4a3');medalIcon(medal(points));replayIcon();}\n    requestAnimationFrame(render);\n  }\n  // Lesson controls are accepted only from the actual containing window.\n  const embedded=window.parent!==window;\n  function receiveLessonMessage(event){\n    if(!embedded||event.source!==window.parent)return;const data=event.data;if(!data||typeof data!=='object'||data.channel!=='flappy-lesson')return;\n    if(data.command==='tap'){activateAudio();if(mode==='dead')replay();else press();}\n    if(data.command==='restart')ready();\n  }\n  window.addEventListener('message',receiveLessonMessage);\n  canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();activateAudio();canvas.focus({preventScroll:true});if(mode==='dead'){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*320/rect.width,yy=(event.clientY-rect.top)*525/rect.height;if(x>=120&&x\u003c=200&&yy>=280&&yy\u003c=330)replay();}else press();});\n  window.addEventListener('keydown',event=>{if(event.code!=='Space')return;event.preventDefault();activateAudio();if(mode==='dead')replay();else press();});\n  ready();requestAnimationFrame(render);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","basePrompt":"기존 게임을 돌기둥 없는 코인 모으기 게임으로 수정해 줘. 입력하면 상승하고 입력하지 않으면 중력으로 내려오며 공중에서도 다시 상승할 수 있어야 해. 코인은 오른쪽에서 나타나 왼쪽으로 움직이고, 닿으면 즉시 사라지며 정확히 한 번 +1점이야. 작은 검은 구름과 바닥에 닿으면 게임 오버야. 검은 구름은 코인보다 앞에 잘 보이게 그려 줘. 다시 시작하면 주인공, 코인, 구름과 점수를 초기화해 줘. 시간 제한이나 목표 개수는 넣지 마. 전체 HTML을 html 코드블록 하나로 출력해 줘."}</script><script src="/static/lesson.9eb32ceb922e.js"></script></body></html>
