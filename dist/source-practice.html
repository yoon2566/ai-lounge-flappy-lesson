//loops
var loopGameloop;
var loopPipeloop;

$(document).ready(function() {
   if(window.location.search == "?debug")
      debugmode = true;
   if(window.location.search == "?easy")
      pipeheight = 200;

   //get the highscore
   var savedscore = getCookie("highscore");
   if(savedscore != "")
      highscore = parseInt(savedscore);

   //start with the splash screen
   showSplash();
});

function getCookie(cname)
{
   var name = cname + "=";
   var ca; try { ca = document.cookie.split(';'); } catch(e) { ca = []; }
   for(var i=0; i<ca.length; i++)
   {
      var c = ca[i].trim();
      if (c.indexOf(name)==0) return c.substring(name.length,c.length);
   }
   return "";
}

function setCookie(cname,cvalue,exdays)
{
   var d = new Date();
   d.setTime(d.getTime()+(exdays*24*60*60*1000));
   var expires = "expires="+d.toGMTString();
   try { document.cookie = cname + "=" + cvalue + "; " + expires; } catch(e) {}
}

function showSplash()
{
   currentstate = states.SplashScreen;

   //set the defaults (again)
   velocity = 0;
   position = 180;
   rotation = 0;
   score = 0;

   //update the player in preparation for the next game
   $("#player").css({ y: 0, x: 0 });
   updatePlayer($("#player"));

   soundSwoosh.stop();
   soundSwoosh.play();

   //clear out all the pipes if there are any
   $(".pipe").remove();
   pipes = new Array();

   //make everything animated again
   $(".animated").css('animation-play-state', 'running');
   $(".animated").css('-webkit-animation-play-state', 'running');

   //fade in the splash
   $("#splash").transition({ opacity: 1 }, 2000, 'ease');
}

function startGame()
{
   currentstate = states.GameScreen;

   //fade out the splash
   $("#splash").stop();
   $("#splash").transition({ opacity: 0 }, 500, 'ease');

   //update the big score
   setBigScore();

   //debug mode?
   if(debugmode)
   {
      //show the bounding boxes
      $(".boundingbox").show();
   }

   //start up our loops
   var updaterate = 1000.0 / 60.0 ; //60 times a second
   loopGameloop = setInterval(gameloop, updaterate);
   // Lesson practice: no pipes.

   //jump from the start!
   playerJump();
}

function updatePlayer(player)
{
   //rotation
   rotation = Math.min((velocity / 10) * 90, 90);

   //apply rotation and position
   $(player).css({ rotate: rotation, top: position });
}

function gameloop() {
   var player = $("#player");

   //update the player speed/position
   velocity += gravity;
   position += velocity;

   //update the player
   updatePlayer(player);

   //create the bounding box
   var box = document.getElementById('player').getBoundingClientRect();
   var origwidth = 34.0;
   var origheight = 24.0;

   var boxwidth = origwidth - (Math.sin(Math.abs(rotation) / 90) * 8);
   var boxheight = (origheight + box.height) / 2;
   var boxleft = ((box.width - boxwidth) / 2) + box.left;
   var boxtop = ((box.height - boxheight) / 2) + box.top;
   var boxright = boxleft + boxwidth;
   var boxbottom = boxtop + boxheight;

   //if we're in debug mode, draw the bounding box
   if(debugmode)
   {
      var boundingbox = $("#playerbox");
      boundingbox.css('left', boxleft);
      boundingbox.css('top', boxtop);
      boundingbox.css('height', boxheight);
      boundingbox.css('width', boxwidth);
   }

   //did we hit the ground?
   if(box.bottom >= $("#land").offset().top)
   {
      playerDead();
      return;
   }

   //have they tried to escape through the ceiling? :o
   var ceiling = $("#ceiling");
   if(boxtop <= (ceiling.offset().top + ceiling.height()))
      position = 0;

   //we can't go any further without a pipe
   if(pipes[0] == null)
      return;

   //determine the bounding box of the next pipes inner area
   var nextpipe = pipes[0];
   var nextpipeupper = nextpipe.children(".pipe_upper");

   var pipetop = nextpipeupper.offset().top + nextpipeupper.height();
   var pipeleft = nextpipeupper.offset().left - 2; // for some reason it starts at the inner pipes offset, not the outer pipes.
   var piperight = pipeleft + pipewidth;
   var pipebottom = pipetop + pipeheight;

   if(debugmode)
   {
      var boundingbox = $("#pipebox");
      boundingbox.css('left', pipeleft);
      boundingbox.css('top', pipetop);
      boundingbox.css('height', pipeheight);
      boundingbox.css('width', pipewidth);
   }

   //have we gotten inside the pipe yet?
   if(boxright > pipeleft)
   {
      //we're within the pipe, have we passed between upper and lower pipes?
      if(boxtop > pipetop && boxbottom < pipebottom)
      {
         //yeah! we're within bounds

      }
      else
      {
         //no! we touched the pipe
         playerDead();
         return;
      }
   }


   //have we passed the imminent danger?
   if(boxleft > piperight)
   {
      //yes, remove it
      pipes.splice(0, 1);

      //and score a point
      playerScore();
   }
}

//Handle space bar
$(document).keydown(function(e){
   //space bar!
   if(e.keyCode == 32)
   {
      //in ScoreScreen, hitting space should click the "replay" button. else it's just a regular spacebar hit
      if(currentstate == states.ScoreScreen)
         $("#replay").click();
      else
         screenClick();
   }
});

//Handle mouse down OR touch start
if("ontouchstart" in window)
   $(document).on("touchstart", screenClick);
else
   $(document).on("mousedown", screenClick);

function screenClick()
{
   if(currentstate == states.GameScreen)
   {
      playerJump();
   }
   else if(currentstate == states.SplashScreen)
   {
      startGame();
   }
}

function playerJump()
{
   velocity = jump;
   //play jump sound
   soundJump.stop();
   soundJump.play();
}

function setBigScore(erase)
{
   var elemscore = $("#bigscore");
   elemscore.empty();

   if(erase)
      return;

   var digits = score.toString().split('');
   for(var i = 0; i < digits.length; i++)
      elemscore.append("<img src='" + ASSET_IMAGES["font_big_" + digits[i] + ".png"] + "' alt='" + digits[i] + "'>");
}

function setSmallScore()
{
   var elemscore = $("#currentscore");
   elemscore.empty();

   var digits = score.toString().split('');
   for(var i = 0; i < digits.length; i++)
      elemscore.append("<img src='" + ASSET_IMAGES["font_small_" + digits[i] + ".png"] + "' alt='" + digits[i] + "'>");
}

function setHighScore()
{
   var elemscore = $("#highscore");
   elemscore.empty();

   var digits = highscore.toString().split('');
   for(var i = 0; i < digits.length; i++)
      elemscore.append("<img src='" + ASSET_IMAGES["font_small_" + digits[i] + ".png"] + "' alt='" + digits[i] + "'>");
}

function setMedal()
{
   var elemmedal = $("#medal");
   elemmedal.empty();

   if(score < 10)
      //signal that no medal has been won
      return false;

   if(score >= 10)
      medal = "bronze";
   if(score >= 20)
      medal = "silver";
   if(score >= 30)
      medal = "gold";
   if(score >= 40)
      medal = "platinum";

   elemmedal.append('<img src="' + ASSET_IMAGES['medal_' + medal + '.png'] + '" alt="' + medal +'">');

   //signal that a medal has been won
   return true;
}

function playerDead()
{
   //stop animating everything!
   $(".animated").css('animation-play-state', 'paused');
   $(".animated").css('-webkit-animation-play-state', 'paused');

   //drop the bird to the floor
   var playerbottom = $("#player").position().top + $("#player").width(); //we use width because he'll be rotated 90 deg
   var floor = flyArea;
   var movey = Math.max(0, floor - playerbottom);
   $("#player").transition({ y: movey + 'px', rotate: 90}, 1000, 'easeInOutCubic');

   //it's time to change states. as of now we're considered ScoreScreen to disable left click/flying
   currentstate = states.ScoreScreen;

   //destroy our gameloops
   clearInterval(loopGameloop);
   clearInterval(loopPipeloop);
   loopGameloop = null;
   loopPipeloop = null;

   //mobile browsers don't support buzz bindOnce event
   if(isIncompatible.any())
   {
      //skip right to showing score
      showScore();
   }
   else
   {
      //play the hit sound (then the dead sound) and then show score
      soundHit.play().bindOnce("ended", function() {
         soundDie.play().bindOnce("ended", function() {
            showScore();
         });
      });
   }
}

function showScore()
{
   //unhide us
   $("#scoreboard").css("display", "block");

   //remove the big score
   setBigScore(true);

   //have they beaten their high score?
   if(score > highscore)
   {
      //yeah!
      highscore = score;
      //save it!
      setCookie("highscore", highscore, 999);
   }

   //update the scoreboard
   setSmallScore();
   setHighScore();
   var wonmedal = setMedal();

   //SWOOSH!
   soundSwoosh.stop();
   soundSwoosh.play();

   //show the scoreboard
   $("#scoreboard").css({ y: '40px', opacity: 0 }); //move it down so we can slide it up
   $("#replay").css({ y: '40px', opacity: 0 });
   $("#scoreboard").transition({ y: '0px', opacity: 1}, 600, 'ease', function() {
      //When the animation is done, animate in the replay button and SWOOSH!
      soundSwoosh.stop();
      soundSwoosh.play();
      $("#replay").transition({ y: '0px', opacity: 1}, 600, 'ease');

      //also animate in the MEDAL! WOO!
      if(wonmedal)
      {
         $("#medal").css({ scale: 2, opacity: 0 });
         $("#medal").transition({ opacity: 1, scale: 1 }, 1200, 'ease');
      }
   });

   //make the replay button clickable
   replayclickable = true;
}

$("#replay").click(function() {
   //make sure we can only click once
   if(!replayclickable)
      return;
   else
      replayclickable = false;
   //SWOOSH!
   soundSwoosh.stop();
   soundSwoosh.play();

   //fade out the scoreboard
   $("#scoreboard").transition({ y: '-40px', opacity: 0}, 1000, 'ease', function() {
      //when that's done, display us back to nothing
      $("#scoreboard").css("display", "none");

      //start the game over!
      showSplash();
   });
});

function playerScore()
{
   score += 1;
   //play score sound
   soundScore.stop();
   soundScore.play();
   setBigScore();
}

function updatePipes()
{
   //Do any pipes need removal?
   $(".pipe").filter(function() { return $(this).position().left <= -100; }).remove()

   //add a new pipe (top height + bottom height  + pipeheight == flyArea) and put it in our tracker
   var padding = 80;

      ".pc-cloud{position:absolute;width:48px;height:32px;text-align:center;font:46px/28px 'Segoe UI Symbol',Arial,sans-serif;color:#15191f;text-shadow:1px 2px 0 #080c11,-1px -1px 0 #3b414b;filter:brightness(0);z-index:40;pointer-events:none}",
      ".pc-guide{position:absolute;left:13px;right:13px;top:270px;padding:9px 4px;background:#fff8d0e8;color:#385033;border:2px solid #657b43;text-align:center;font:700 13px/1.5 Arial,'Malgun Gothic',sans-serif;z-index:110;pointer-events:none}"

   document.head.appendChild(css);

   var guide = document.createElement('div');
   guide.className = 'pc-guide';
   guide.textContent = '코인 +1점 · 구름과 땅에 닿으면 끝!';
   area.appendChild(guide);

   // Local-only scoring: no cookie persistence. Same-window best score is kept in memory.
   getCookie = function () { return ''; };
   setCookie = function () {};

   function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
         var j = Math.floor(Math.random() * (i + 1));
         var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
   }

   // Pull the next band index from a shuffled bag; the bag is reshuffled each cycle.
   function nextBand(kind) {
      var bag = (kind === 'coin') ? coinBag : cloudBag;
      if (bag.length === 0) {
         var order = [];
         for (var i = 0; i < BAND_COUNT; i++) order.push(i);
         shuffle(order);
         for (var k = 0; k < order.length; k++) bag.push(order[k]);
      }
      return bag.shift();
   }

   // Pick a height in the chosen band with random jitter, far from the previous height.
   function pickHeight(kind) {
      var min = (kind === 'coin') ? COIN_MIN : CLOUD_MIN;
      var max = (kind === 'coin') ? COIN_MAX : CLOUD_MAX;
      var gap = (kind === 'coin') ? COIN_GAP : CLOUD_GAP;
      var prev = (kind === 'coin') ? lastCoinY : lastCloudY;
      var span = (max - min) / BAND_COUNT;

      var best = null, bestDist = -1;
      for (var attempt = 0; attempt < 8; attempt++) {
         var band = nextBand(kind);
         var lo = min + band * span;
         var y = lo + span * (0.1 + Math.random() * 0.8);
         y = Math.max(min, Math.min(max, y));
         var dist = (prev === null) ? Infinity : Math.abs(y - prev);
         if (dist >= gap) return y;
         if (dist > bestDist) { bestDist = dist; best = y; }
      }
      return best !== null ? best : (min + max) / 2;
   }

   function clearActors() {
      actors.forEach(function (a) { a.node.remove(); });
      actors = [];
      coinBag = [];
      cloudBag = [];
      lastCoinY = null;
      lastCloudY = null;
      lastCoinSpawnX = 0;
   }

   function spawn(kind, x, y) {
      var node = document.createElement('div');
      node.className = (kind === 'coin') ? 'pc-coin' : 'pc-cloud';
      node.setAttribute('role', 'img');
      node.setAttribute('aria-label', kind === 'coin' ? '코인' : '작은 구름 장애물');
      if (kind === 'cloud') node.textContent = '☁\uFE0E';
      area.appendChild(node);
      var a = { kind: kind, x: x, y: y, node: node };
      actors.push(a);
      place(a);
      return a;
   }

   function place(a) {
      var offX = (a.kind === 'coin') ? 12 : 24;
      var offY = (a.kind === 'coin') ? 12 : 16;
      a.node.style.left = (a.x - offX) + 'px';
      a.node.style.top = (a.y - offY) + 'px';
   }

   // Keep new coins/clouds from overlapping the opposite kind near the spawn line.
   function clearOfOpposite(kind, x, y) {
      for (var i = 0; i < actors.length; i++) {
         var a = actors[i];
         if (a.kind === kind) continue;
         if (Math.abs(a.x - x) < 90 && Math.abs(a.y - y) < 55) return false;
      }
      return true;
   }

   // Circle-vs-rect test for coin pickup (generous radius for fairness).
   function coinTouch(b, a) {
      var cx = Math.max(b.left, Math.min(a.x, b.right));
      var cy = Math.max(b.top, Math.min(a.y, b.bottom));
      var dx = cx - a.x, dy = cy - a.y;
      return dx * dx + dy * dy <= 100;
   }

   // Rect-vs-rect test for cloud collision.
   function overlap(b, x0, y0, x1, y1) {
      return b.right > x0 && b.left < x1 && b.bottom > y0 && b.top < y1;
   }

   function update(dt) {
      var origin = area.getBoundingClientRect();
      var p = document.getElementById('player').getBoundingClientRect();
      var bird = {
         left: p.left - origin.left + 4,
         right: p.right - origin.left - 4,
         top: p.top - origin.top + 3,
         bottom: p.bottom - origin.top - 3
      };

      nextCoin -= dt;
      nextCloud -= dt;

      if (nextCoin <= 0) {
         var coinX = 350 + Math.random() * 30;
         var coinY = pickHeight('coin');
         var tries = 0;
         while (tries < 4 && !clearOfOpposite('coin', coinX, coinY)) {
            coinY = pickHeight('coin');
            tries++;
         }
         if (clearOfOpposite('coin', coinX, coinY)) {
            spawn('coin', coinX, coinY);
            lastCoinY = coinY;
            nextCoin = 0.85 + Math.random() * 0.85;
         } else {
            nextCoin = 0.2;
         }
      }

      if (nextCloud <= 0) {
         var cloudX = 350 + Math.random() * 30;
         var cloudY = pickHeight('cloud');
         var ctries = 0;
         while (ctries < 4 && !clearOfOpposite('cloud', cloudX, cloudY)) {
            cloudY = pickHeight('cloud');
            ctries++;
         }
         if (clearOfOpposite('cloud', cloudX, cloudY)) {
            spawn('cloud', cloudX, cloudY);
            lastCloudY = cloudY;
            nextCloud = 2.8 + Math.random() * 1.8;
         } else {
            nextCloud = 0.25;
         }
      }

      for (var i = actors.length - 1; i >= 0; i--) {
         var a = actors[i];
         a.x -= dt * (a.kind === 'coin' ? 85 : 70);
         place(a);

         if (a.kind === 'cloud' && overlap(bird, a.x - 18, a.y - 10, a.x + 18, a.y + 10)) {
            playerDead();
            return;
         }

         if (a.kind === 'coin' && coinTouch(bird, a)) {
            a.node.remove();
            actors.splice(i, 1);
            playerScore();
            continue;
         }

         if (a.x < -35) {
            a.node.remove();
            actors.splice(i, 1);
         }
      }
   }

   startGame = function () {
      clearActors();
      gameActive = true;
      deadNotified = false;
      last = performance.now();
      nextCoin = 1.1;
      nextCloud = 2.5 + Math.random() * 1.5;
      guide.style.display = 'none';
      spawn('coin', 106, Math.max(45, position - 6));
      sourceStart();
   };

   gameloop = function () {
      sourceLoop();
      if (currentstate !== states.GameScreen) return;

      var now = performance.now();
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      update(dt);
   };

   playerDead = function () {
      if (deadNotified) return;
      deadNotified = true;
      gameActive = false;
      sourcePlayerDead();
   };

   showSplash = function () {
      clearActors();
      gameActive = false;
      deadNotified = false;
      guide.style.display = 'block';
      sourceSplash();
   };
})();
