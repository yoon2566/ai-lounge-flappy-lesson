<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI와 게임 코드 만들기</title><link rel="stylesheet" href="/course-code.css"></head><body><main><section class="instructions"><p id="step" class="tag"></p><h1 id="title"></h1><p id="intro"></p><label for="prompt">AI에게 이렇게 말해요</label><textarea id="prompt" rows="8"></textarea><p class="hint">그대로 만들어도 좋아요. 바꾸고 싶은 말이 있으면 고쳐 보세요.</p><button id="generate" class="primary" disabled>✨ 이 말로 게임 만들기</button><button id="cancel" hidden>기다리기 중지</button><p id="status" role="status" aria-live="polite"></p><div id="need-classic" hidden><p>앞 단계에서 돌기둥 게임 코드를 먼저 만들어요.</p><button id="go-classic">돌기둥 게임 만들기로</button></div><details><summary>만들어진 코드 보기</summary><p>AI가 쓴 이 코드가 오른쪽 게임이 되었어요.</p><pre id="code">게임을 만들면 여기에 코드가 나와요.</pre><button id="copy">코드 복사</button><button id="download">HTML 파일 받기</button></details><button id="next" hidden class="primary"></button></section><section class="result"><h2>내가 만든 게임</h2><p id="empty">왼쪽의 만들기 버튼을 눌러 보세요.</p><iframe id="game" title="AI가 만든 내 게임" sandbox="allow-scripts" hidden></iframe><div class="actions" id="actions" hidden><button id="tap">▶ 시작 / 날기</button><button id="restart">↻ 다시 시작</button></div></section></main><script type="module" src="/course-code.js"></script></body></html>
